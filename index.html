<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QvaPay P2P</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0f111a;
            --bg-card: #1a1d2d;
            --primary: #00d1b2; /* QvaPay Green */
            --secondary: #f6465d; /* Sell Red */
            --text-main: #ffffff;
            --text-muted: #8b8e9f;
            --border: #2a2e42;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 85px; overflow-x: hidden; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;}
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: bold; color: var(--primary); }
        .user-id { background: #0f111a; padding: 6px 12px; border-radius: 20px; font-size: 13px; border: 1px solid var(--border);}

        /* Pages */
        .page { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Tabs */
        .trade-tabs { display: flex; background: var(--bg-card); border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid var(--border);}
        .tab { flex: 1; text-align: center; padding: 15px; font-weight: bold; cursor: pointer; color: var(--text-muted); transition: 0.3s;}
        .tab.active-buy { background: var(--primary); color: #000; }
        .tab.active-sell { background: var(--secondary); color: white; }

        /* Market Price */
        .market-card { background: var(--bg-card); border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border);}
        .market-title { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
        .market-price { font-size: 36px; font-weight: bold; color: var(--primary); display: flex; align-items: baseline; gap: 5px;}
        .market-price span { font-size: 16px; color: var(--text-muted); }

        /* Inputs */
        .input-group { margin-bottom: 20px; }
        .input-group label { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; display: block; }
        .input-wrapper { display: flex; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; align-items: center;}
        .input-wrapper input { flex: 1; background: transparent; border: none; color: white; font-size: 20px; outline: none; }
        .input-suffix { color: var(--text-muted); font-weight: bold; }

        .total-box { background: rgba(0, 209, 178, 0.1); border: 1px solid var(--primary); padding: 15px; border-radius: 12px; margin-bottom: 25px; display: flex; justify-content: space-between; font-size: 16px;}
        .total-box span { font-weight: bold; color: var(--primary); }

        .btn-action { width: 100%; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; border: none; cursor: pointer; color: #000; transition: 0.2s;}
        .btn-action.buy { background: var(--primary); }
        .btn-action.sell { background: var(--secondary); color: white; }
        .btn-action:active { transform: scale(0.98); }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-card); display: flex; justify-content: space-around; padding: 10px 0 20px 0; border-top: 1px solid var(--border); z-index: 500; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: var(--text-muted); cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }

        /* Toast */
        #toast { visibility: hidden; min-width: 250px; background-color: var(--primary); color: #000; text-align: center; border-radius: 10px; padding: 16px; position: fixed; z-index: 3000; left: 50%; bottom: 100px; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; font-weight: bold; }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🟢 QvaPay P2P</div>
        <div class="user-id">ID: <span id="display-id">...</span></div>
    </div>

    <!-- ================= TRADE PAGE ================= -->
    <div id="page-trade" class="page active">
        
        <div class="trade-tabs">
            <div class="tab active-buy" id="tab-buy" onclick="setTradeType('buy')">Buy USDT</div>
            <div class="tab" id="tab-sell" onclick="setTradeType('sell')">Sell USDT</div>
        </div>

        <div class="market-card">
            <div class="market-title">QvaPay Market Price</div>
            <div class="market-price" id="market-price">1.00 <span>USD / USDT</span></div>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">Rate updated from QvaPay API</div>
        </div>

        <div class="input-group">
            <label id="amount-label">I want to Buy (USDT)</label>
            <div class="input-wrapper">
                <input type="number" id="usdt-amount" placeholder="0.00" oninput="calculateTotal()">
                <span class="input-suffix">USDT</span>
            </div>
        </div>

        <div class="total-box">
            <span>Total to Pay:</span>
            <span id="total-price">0.00 USD</span>
        </div>

        <button class="btn-action buy" id="action-btn" onclick="submitTrade()">Buy USDT Now</button>
    </div>

    <!-- ================= BOTTOM NAV ================= -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('trade', this)"><div class="nav-icon">💱</div>Trade</div>
        <div class="nav-item" onclick="switchPage('wallet', this)"><div class="nav-icon">👛</div>Wallet</div>
    </div>

    <!-- ================= WALLET PAGE ================= -->
    <div id="page-wallet" class="page">
        <h2 style="margin-bottom: 20px;">My Assets</h2>
        <div class="market-card">
            <div class="market-title">Available Balance</div>
            <div class="market-price" style="color: var(--primary);">0.00 <span>USDT</span></div>
        </div>
    </div>

    <div id="toast">Processing...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let tradeType = 'buy'; 
        let currentRate = 1.00; // QvaPay የገበያ ዋጋ (1 USDT = 1 USD)

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('display-id').innerText = tg.initDataUnsafe.user.id;
        }

        // 1. Tab Switching Logic
        window.setTradeType = function(type) {
            tradeType = type;
            const tabBuy = document.getElementById('tab-buy');
            const tabSell = document.getElementById('tab-sell');
            const actionBtn = document.getElementById('action-btn');

            if(type === 'buy') {
                tabBuy.className = 'tab active-buy';
                tabSell.className = 'tab';
                actionBtn.className = 'btn-action buy';
                actionBtn.innerText = "Buy USDT Now";
                document.getElementById('amount-label').innerText = "I want to Buy (USDT)";
            } else {
                tabBuy.className = 'tab';
                tabSell.className = 'tab active-sell';
                actionBtn.className = 'btn-action sell';
                actionBtn.innerText = "Sell USDT Now";
                document.getElementById('amount-label').innerText = "I want to Sell (USDT)";
            }
            document.getElementById('usdt-amount').value = '';
            calculateTotal();
        };

        // 2. Calculate Total
        window.calculateTotal = function() {
            const amount = parseFloat(document.getElementById('usdt-amount').value) || 0;
            const total = amount * currentRate;
            document.getElementById('total-price').innerText = total.toFixed(2) + " USD";
        };

        // 3. Submit to Admin
        window.submitTrade = function() {
            const amount = parseFloat(document.getElementById('usdt-amount').value);
            if(!amount || amount <= 0) {
                showToast("❌ Enter a valid amount!");
                return;
            }

            const total = amount * currentRate;
            const user = tg.initDataUnsafe.user;

            // ወደ Termux ሰርቨር መላክ
            fetch('/api/complete_task', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    task_name: `${tradeType.toUpperCase()} USDT (QvaPay)`, 
                    user_id: user.id, 
                    username: user.username || user.first_name,
                    details: `Amount: ${amount} USDT | Total: ${total.toFixed(2)} USD`
                })
            }).then(res => res.json()).then(data => { 
                if(data.status === "success") {
                    showToast(`✅ Request sent to Admin!`);
                    document.getElementById('usdt-amount').value = '';
                    calculateTotal();
                }
            }).catch(err => showToast("❌ Error connecting to server"));
        };

        window.switchPage = function(pageId, navElement) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            navElement.classList.add('active');
        };

        window.showToast = function(msg) {
            const toast = document.getElementById("toast"); 
            toast.innerText = msg; 
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        };
    </script>
</body>
</html>
